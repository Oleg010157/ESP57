;convert parametr cod to phizical value
;<Name>=<format>,<K>,<A>,<nHi>,<nLo>,color
;<Name>=@<format>,expression
;format- число знаков после запятой
;^ - for int
;['var] - phisical meaning of variables 
;[var] - cod meaning of variables
;[var~+5] shift variables right on 5 steps 
;[var~-5] shift variables left on 5 steps
;@0,[var]=[var]*0.5   var(i)=var(i-1)*0.5   Вычисление текущего значения по предыдущему
;mPos=@@  - номер отсчёта с начала файла
;mPos1=@@@ - номер отсчёта с начала экрана
 

[ParLeft]
[ParRight]
[ParList]

;MEASURED VARIABLES

Ia =   ^1,0.1,0,1,2,1  	;1 фазный ток
Ib = ^1,0.1,0,3,4,1 	;2 фазный ток	
Ic = ^1,0.1,0,5,6,1 	;3 фазный ток 
Ir1 = ^1,0.1,0,7,8,1 	;4 

;mbox1 -----------------------------------------
Va = ^1,0.1,0,9,10,1 	;5 эл.номер зуба напротив датчика сч.колеса
Vb = ^1,0.1,0,11,12,1	;6 ток парка нагрузки
Vc = ^1,0.1,0,13,14,1	;7 
rg = ^1,0.1,0,15,16,1	;8
 
;mbox2 -----------------------------------------
fr = ^2,0.01,0,17,18,1		;9 
freq= ^2,0.01,0,19,20,1		;10  
Udc = ^1,0.1,0,21,22,1		;11 
Is = ^1,0.1,0,23,24,1		;12
 

;CALCULATED
Va0=@1,[`Va~-2]
Vb0=@1,[`Vb~-2]
;Vc0=@1,[`Vc~-2]
pa_cal=@0,[`Va0]*[`Ia]
pb_cal=@0,[`Vb0]*[`Ib]
;pc_cal=@0,[`Vc0]*[`Ic]
;ps = @0,[pa_cal]+[pb_cal]+[pc_cal]
;psf=@0, [psf]*0.99+[ps]*0.01

Uaa=@0,[Uaa]+[`Va]*[`Va]
Ua2 =@1,if([mPos1]<5;[`Va];sqrt([Uaa]/[mPos1]))
Uab =@1,[`Va]-[`Vc]
Iaa=@0,[Iaa]+[`Ia]*[`Ia]
Ia2 =@1,if([mPos1]<5;[`Ia];sqrt([Iaa]/[mPos1]))

;Sva=@0,[Ua2]*[Ia2]*3
;PF=@3,[psf]/[Sva]
;rfui=@3,[`fui]/180*3.14

;cos = @3,cos([rfui])
;cos0 = @3,[cos0]+[cos]
;cosF =@3,[cos0]/[mPos1]

;w_rad = @1,abs([`freq])*2/60*6.28
;-----------------------------------------------
Vamax =@1,if( [`Va] >[Vamax];[`Va];[Vamax])
Vamin =@1,if( [`Va] <[Vamin];[`Va];[Vamin])

Iamax =@1,if( [`Ia] >[Iamax];[`Ia];[Iamax])
Iamin =@1,if( [`Ia] <[Iamin];[`Ia];[Iamin])

;Za_Om=@2,[Vamax]/[Iamax]/1.5
;Lma_mH =@3,[Za_Om]/[w_rad]*1000

;-----------------------------------------------
;Vbmax =@1,if( [`Vb] >[Vbmax];[`Vb];[Vbmax])
;Vbmin =@1,if( [`Vb] <[Vbmin];[`Vb];[Vbmin])

Ibmax =@1,if( [`Ib] >[Ibmax];[`Ib];[Ibmax])
Ibmin =@1,if( [`Ib] <[Ibmin];[`Ib];[Ibmin])

;Zb_Om=@2,[Vbmax]/[Ibmax]/1.5
;Lmb_mH =@3,[Zb_Om]/[w_rad]*1000

;-----------------------------------------------
;Vcmax =@1,if( [`Vc] >[Vcmax];[`Vc];[Vcmax])
;Vcmin =@1,if( [`Vc] <[Vcmin];[`Vc];[Vcmin])

Icmax =@1,if( [`Ic] >[Icmax];[`Ic];[Icmax])
Icmin =@1,if( [`Ic] <[Icmin];[`Ic];[Icmin])

;Zc_Om=@2,[Vcmax]/[Icmax]/1.5
;Lmc_mH =@3,[Zc_Om]/[w_rad]*1000 

;Xl = @3,[w_rad]*(13.044)*1e-3 
;Rs =@3,sqrt( [Zc_Om]*[Zc_Om] -[Xl]*[Xl])

;Icc=@2,-([`Ia]+[`Ib])

Null = @0,0
mPos=@@
mPos1=@@@
[New]





