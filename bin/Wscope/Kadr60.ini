; Карта каналов Wscope для медленной записи Kadr60 - REF кадр целиком
; (CAN ID 140, 32 слова, 64 байта, DLC 15). Заведена 11.10.2026.
;
; Быстрые ленты F3_convertor и F3_grid показывают ФОРМУ: мгновенные токи и
; напряжения пять тысяч раз в секунду, секунды записи. Этот набор - ХОД
; РЕЖИМА: действующие значения, мощности, частота сети, постоянка в
; трансформаторе, запас по m, состояние автомата и аварии. Отсчёт раз в
; 50 мс, запись - на минуты и часы.
;
; ЭТО ТОТ САМЫЙ КАДР, ЧТО ПОКАЗЫВАЕТ ОКНО Motor_Control, отдельного под запись
; нет. Прибор шлёт его по таймеру T0, пока нажато "Подключить", и в файл он
; ложится сырым, слово в слово. Отсюда три следствия:
;
;   в файле ровно то, что на экране - расхождения быть не может;
;   слова 4..7  несут тот набор, что выбран переключателем "код / мгн / rms"
;               в окне. Обычно rms; переключили на ходу - в записи с этого
;               места другие величины под теми же именами. Какой набор шёл,
;               говорит канал teleSel;
;   в аварии    измеренные каналы СТОЯТ на числах её момента, как и в окне:
;               прямая линия после state = 4 - это заморозка, а не мост,
;               который продолжает работать. Живыми остаются ошибки, флаги,
;               coreT, state, fault и IsetRef.
;
; Период 50 мс задан таймером прибора и из окна не меняется: поле рядом с
; "F2 Кадр" относилось к упразднённому кадру 131.
;
; СОВПАДАТЬ ОБЯЗАНЫ ТРИ МЕСТА, имён внутри кадра нет:
;   прошивка   INVERTOR_CCS/KSP/REF_Kadr.c, send_REF_kadr
;   разбор     Oleg/Kadr60.cs, Parse140 - он же кладёт кадр в запись
;   этот файл
;
; Живой осциллограф Motor_Control этот набор не рисует: он слушает только
; быстрый кадр 103.
;
; ИМЕНА НАМЕРЕННО НЕ ТЕ, ЧТО В БЫСТРЫХ ЛЕНТАХ. Wscope хранит размах кривой по
; ИМЕНИ канала, в сырых кодах, один на все шаблоны (WScopeE.ini). iSec в
; F3_convertor - мгновенный ток с ценой 0.01 А, здесь - слово кадра 140 с
; ценой 0.1 А: под одним именем размах, настроенный для одного, ломал бы
; картинку другого. Поэтому iSecTel, а не iSec. Совпадают имена только там,
; где совпадают и величина, и масштаб: Iset, IsetRef, state.
;
; Формат строк, кавычки в выражениях и настройки вида - всё как в
; F3_convertor.ini, там и описано. Кратко:
;   ИЗМЕРЯЕМЫЙ   <Имя>=<format>,<K>,<A>,<nHi>,<nLo>,цвет
;                ^ - знаковый, format - знаков после запятой,
;                значение = код*K + A, nHi,nLo - байты слова, с единицы
;   ВЫЧИСЛЯЕМЫЙ  <Имя>=@<format>,<выражение>
;                [имя] - сырой код, [`имя] - после K и A

[ParLeft]
[ParRight]
[ParList]

;ИЗМЕРЯЕМЫЕ - по одной записи на слово кадра, порядок задан прошивкой
err1     =  0,1,0,1,2,1          ;  0  слово ошибок моста, биты
err2     =  0,1,0,3,4,1          ;  1  то же второго канала, биты
sbit     =  0,1,0,5,6,1          ;  2  биты управления: 0 связь, 3 пуск
res3     =  0,1,0,7,8,1          ;  3  резерв, всегда 65535
iPriTel  = ^1,0.1,0,9,10,1       ;  4  ток первички, А        - набор по teleSel
iSecTel  = ^1,0.1,0,11,12,1      ;  5  ток вторички, А        - набор по teleSel
u220Tel  = ^1,0.1,0,13,14,1      ;  6  сеть, В                - набор по teleSel
uSecTel  = ^1,0.1,0,15,16,1      ;  7  выход инвертора, В     - набор по teleSel
uBat     = ^1,0.1,0,17,18,1      ;  8  напряжение АКБ, В
coreT    = ^0,1,0,19,20,1        ;  9  температура кристалла, град
gtWord   =  0,1,0,21,22,1        ; 10  автомат: State + 256*код аварии
Iset     = ^2,0.01,0,23,24,1     ; 11  уставка после рампы, А rms
gain     =  0,1,0,25,26,1        ; 12  sineB.gain, амплитуда синуса, коды
teleSel  =  0,1,0,27,28,1        ; 13  набор слов 4..7: 0 коды, 1 мгн, 2 rms
flags1   =  0,1,0,29,30,1        ; 14  флаги моста: бит 0 - ключи открыты
flags2   =  0,1,0,31,32,1        ; 15  флаги второго канала
u220freq =  2,0.01,0,33,34,1     ; 16  частота сети, Гц
pSec     = ^0,1,0,35,36,1        ; 17  активная мощность на выходе, Вт
qSec     = ^0,1,0,37,38,1        ; 18  реактивная, вар
sSec     = ^0,1,0,39,40,1        ; 19  полная, В*А
pfSec    = ^4,0.0001,0,41,42,1   ; 20  коэффициент мощности P/S
iPri_av  = ^2,0.01,0,43,44,1     ; 21  постоянка в первичке, А
uDCcomp  = ^3,0.001,0,45,46,1    ; 22  чем её давит мост: mDC*Udc, В
IsetRef  = ^2,0.01,0,47,48,1     ; 23  уставка с движка Iзад, А rms
mPeak    =  4,0.0001,0,49,50,1   ; 24  пик |m| за период сети
satLast  =  0,1,0,51,52,1        ; 25  тактов в упоре по m за период
k60Cnt   =  0,1,0,63,64,1        ; 31  счётчик кадров

; Слова 4..7 при teleSel = 2 - действующие за период сети, при 1 -
; мгновенные, и оба раза цена 0.1 (А или В). При teleSel = 0 это коды АЦП:
; число на графике тогда в десять раз меньше кода, а единицы теряют смысл.
; Мгновенные и коды в записи раз в 50 мс - не сигнал, а биения с 50 Гц;
; для длинной записи держите в окне rms.
;
; Скачок уставки читается цепочкой IsetRef -> Iset -> iSecTel: нажали, рампа
; пошла, ток дошёл. pSec против sSec и pfSec - сколько из отданного активно.
;
; iPri_av и uDCcomp смотреть ВМЕСТЕ: первое - куда уехал поток в сердечнике,
; второе - чем контур тянет его обратно. В исправном контуре знаки у них
; противоположны; совпали - полярность датчика первички неверна, и обратная
; связь стала положительной (grid_tie.txt, 3.1.4).
;
; mPeak - сколько осталось до упора: при mMax = 0.95 число 0.93 значит, что
; следующий шаг уставки упрётся. satLast - сколько тактов из ста уже стояло
; в потолке; больше satLimit - авария 64. В АВАРИИ оба числа не текущие, а
; защёлкнутые ею самой - тот период, что её вызвал.
;
; gtWord несёт два числа в одном слове, ниже они разобраны на state и fault.
;
; k60Cnt ОБЯЗАН оставаться в последнем слове - по его изменению Motor_Control
; считает запись готовой. Растёт на единицу с каждым отправленным кадром:
; скачок больше единицы - кадр потерян в пути. Заморозка в аварии его не
; касается, запись идёт и тогда.

;ВЫЧИСЛЯЕМЫЕ - не из кадра, задаются здесь
;
; state: 0 OFF, 1 SYNC, 2 RAMP, 3 RUN, 4 FAULT. fault - код аварии сетевого
; режима, ноль - аварии нет.
state   = @0,[gtWord] and 255
fault   = @0,([gtWord]-([gtWord] and 255))/256
pwmOn   = @0,[flags1] and 1
cnt256  = @0,[k60Cnt] and 255

Null = @0,0
mPos=@@
mPos1=@@@

[New]
