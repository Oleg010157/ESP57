; Карта каналов Wscope для быстрой ленты F3_grid - контур тока в сети изнутри
; (CAN ID 103, 16 слов, 32 байта, DLC 13; команда 1001, код 6). Заведена
; 09.10.2026.
;
; F3_convertor показывает, ЧТО вышло: задание, токи, m. Этот набор - ПОЧЕМУ:
; сколько в напряжении моста даёт прямая связь по сети, сколько добавляет PR,
; какую часть из этого держит резонатор, что заказано и что получилось на
; выходе, на какое напряжение звена контур делит и в каком состоянии автомат.
;
; Цепочка расчёта в прошивке (grid_tie_step, my_Files/grid_tie.c):
;
;     iRef  = sqrt2 * (Iset*sin + Iq*cos)
;     ierr  = iRef - iSec
;     prOut = Kp*ierr + prX1               prX1 - резонатор на частоте сети
;     uCmd  = uGrid + prOut                прямая связь плюс поправка PR
;     m     = uCmd / (n * Udc) + mDC,      затем упор по mMax
;
; Читается снизу вверх: uCmd близко к uGrid - контуру почти нечего делать;
; prOut растёт - падение на рассеянии и обмотках под током; prX1 упёрся в
; xMax - резонатор на пределе; m на потолке (бит sat) - не хватает звена.
; Udc в кадре нет: при UdcSrc = 0 это константа UdcFixed.
;
; В слежении (State = 1) считается не контур тока, а контур напряжения prv:
; prOut и prX1 тогда - его выход и резонатор, iRef и ierr - нули. Единицы
; те же, вольты на вторичке, поэтому кривые при замыкании контактора смысла
; не меняют, меняется лишь то, чью ошибку отрабатывают.
;
; Вне контура (OFF, FAULT, слежение при закрытых ключах) prOut, ierr и uCmd -
; нули, а не последнее значение: прошивка их обнуляет.
;
; СОВПАДАТЬ ОБЯЗАНЫ ТРИ МЕСТА, имён внутри кадра нет:
;   прошивка   INVERTOR_CCS/my_Files/1ph_Sin.c, ветка F3_grid в прерывании
;   разбор     Oleg/Kadr60.cs, ProcessFrame103 (общий с F3_convertor)
;   этот файл
; Живой осциллограф Motor_Control читает этот же файл и четвёртым не является.
;
; Формат строк, кавычки в выражениях, кодировка и настройки вида - всё как в
; F3_convertor.ini, там и описано. Кратко:
;   ИЗМЕРЯЕМЫЙ   <Имя>=<format>,<K>,<A>,<nHi>,<nLo>,цвет
;                ^ - знаковый, format - знаков после запятой,
;                значение = код*K + A, nHi,nLo - байты слова, с единицы
;   ВЫЧИСЛЯЕМЫЙ  <Имя>=@<format>,<выражение>
;                [имя] - сырой код, [`имя] - после K и A

[ParLeft]
[ParRight]
[ParList]

;ИЗМЕРЯЕМЫЕ - по одной записи на слово кадра, порядок задан прошивкой
iRef     = ^2,0.01,0,1,2,1       ;  0  задание тока, мгновенное, А
iSec     = ^2,0.01,0,3,4,1       ;  1  ток вторички = ток в сеть, А
ierr     = ^2,0.01,0,5,6,1       ;  2  ошибка контура iRef - iSec, А
uGrid    = ^1,0.1,0,7,8,1        ;  3  сеть на вторичке = прямая связь, В
prOut    = ^1,0.1,0,9,10,1       ;  4  выход PR: Kp*ierr + prX1, В
prX1     = ^1,0.1,0,11,12,1      ;  5  резонатор PR, В
uCmd     = ^1,0.1,0,13,14,1      ;  6  заказано мосту: uGrid + prOut, В
uSec     = ^1,0.1,0,15,16,1      ;  7  получено на выходе инвертора, В
m        = ^4,0.0001,0,17,18,1   ;  8  индекс модуляции после упора
mDC      = ^5,0.00001,0,19,20,1  ;  9  поправка постоянной составляющей
IsetRef  = ^2,0.01,0,21,22,1     ; 10  уставка с движка Iзад, А rms
Iset     = ^2,0.01,0,23,24,1     ; 11  уставка после рампы, А rms
iPri     = ^2,0.01,0,25,26,1     ; 12  ток первички, А
phaseErr = ^4,0.0001,0,27,28,1   ; 13  ошибка детектора фазы, единицы sin()
flags    =  0,1,0,29,30,1        ; 14  флаги, биты ниже
tick     =  0,1,0,31,32,1        ; 15  счётчик тактов управления

; Скачок читается цепочкой: IsetRef - нажали, Iset - рампа пошла (шагами
; раз за период, на переходе сети через ноль), iRef - задание мгновенного
; тока, iSec - ток пошёл. Имя IsetRef, а не Iref: iRef уже занят мгновенным
; заданием, а Wscope и осциллограф регистр в именах не различают.
;
; До 09.10.2026 в слове 10 стоял gt.Udc - то, на что контур делит при
; расчёте m. При UdcSrc = 0 там константа UdcFixed, то есть прямая линия;
; датчик звена - Vin в F3_convertor.
;
; uSec против uGrid: при замкнутом контакторе датчик uSec стоит на сети и
; показывает её же. Мёртвое время и падение на ключах ложатся внутри
; трансформатора, на рассеянии, и датчик их не видит - они видны в ierr и
; prOut. uSec нужен в слежении (uSec - uGrid и есть ошибка контура
; напряжения) и в момент замыкания контактора.
;
; flags:
;   биты 0..2  State: 0 OFF, 1 SYNC, 2 RAMP, 3 RUN, 4 FAULT
;   бит  3     m в этом такте на потолке mMax          (8)
;   бит  4     ключи открыты                           (16)
;   бит  5     контактор замкнут                       (32)
;
; tick ОБЯЗАН оставаться в последнем слове - по его изменению Motor_Control
; считает запись готовой. Подробно - в F3_convertor.ini.

;ВЫЧИСЛЯЕМЫЕ - не из кадра, задаются здесь
;
; Маски - единственная форма, которую кроме Wscope считает и живой
; осциллограф. Поэтому биты показываются своим весом: sat даёт 0 или 8,
; keys 0 или 16, а не 0 или 1. Сдвиг в осциллографе не считается.
state   = @0,[flags] and 7
sat     = @0,[flags] and 8
keys    = @0,[flags] and 16
contact = @0,[flags] and 32
tick256 = @0,[tick] and 255

; Пропорциональная часть PR, Kp*ierr, - разность двух каналов. Только для
; Wscope: живой осциллограф арифметику не считает и покажет канал красным.
prP     = @1,[`prOut]-[`prX1]

Null = @0,0
mPos=@@
mPos1=@@@

[New]
