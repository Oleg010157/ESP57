; Wscope channel map for the single-phase bridge oscilloscope frame
; (CAN ID 103, 16 words, 32 bytes, DLC 13).
;
; Extended from 12 to 16 words on 23.09.2026: the frame carried only two
; currents and one voltage, now it carries the inverter output voltage and the
; battery current as well. Words 0..9 kept their places, so an old .wsc setup
; still reads those channels correctly. The tick counter moved from word 11 to
; word 15 - it has to be the last word, see the note at the bottom.
;
; This file is tracked in the repository and Wscope loads it from this very
; folder, so there is nothing to copy anywhere: bin/Wscope/ is both the master
; and the working copy, and it travels with the project to the other machine.
; (It used to say C:\Work\K55\... - that was the old project path.)
;
; The name is fixed: Motor_Control picks the file by frame name
; (Kadr60.cs, f2kadrName == "F3_convertor").
;
; FOUR PLACES MUST AGREE, there are no names inside the frame itself:
;   firmware   INVERTOR_CCS/my_Files/1ph_Sin.c, the F3 block in the control ISR
;   parser     Oleg/Kadr60.cs, ProcessFrame103
;   live scope Scope/F3Channels.cs, the channel table
;   this file
;
; ASCII ONLY, comments in English - on purpose, same call as for run-can.cmd.
; The other .ini files in that folder are Windows-1251, the repository is
; UTF-8, and this one has to live in both places. ASCII removes the
; re-encoding step from the copy and cannot turn into mojibake either way.
; The reasoning in Russian belongs with the frame itself:
; INVERTOR_CCS/my_Files/1ph_Sin.c, and my_Files/grid_tie.txt section 6.2.
;
; MEASURED channel: <Name>=<format>,<K>,<A>,<nHi>,<nLo>,color
;   ^        signed 16-bit
;   format   digits after the decimal point
;   K, A     value = code * K + A
;   nHi,nLo  byte positions in the frame, 1-based, high byte first
;            word i occupies bytes 2i+1 and 2i+2
;
; CALCULATED channel: <Name>=@<format>,<expression>
;
; Inside an expression a channel is referenced in one of two forms, and the
; difference is NOT cosmetic:
;
;     [name]     the RAW CODE, exactly as it arrived in the frame
;     [`name]    the value AFTER the linear transform, i.e. code * K + A
;
; So [`U220] is 310 volts where [U220] is 3100. Pick the wrong one and the
; trace is quietly wrong by a factor of K - the worst kind of measurement
; error, because it still looks like a signal.
;
; This distinction exists only for MEASURED channels: a calculated one has
; neither a code nor a K, which is why no calculated channel in any of these
; files ever carries the backtick.
;
; Where K = 1 the two forms are identical, and most of the files use them
; interchangeably there - [tick], [IsrTic], [Pabc1], [yTorq] are all K = 1.
; That is why the inconsistency is harmless in those places and real in
; F3_Dead_Time.ini, where slipF filters [slip1] - K = 0.002 - without the
; backtick and therefore converges to the raw code, 500x the physical value.
;
; Written down here on 04.10.2026 because the Wscope sources (Delphi) are gone
; and this rule was not recorded anywhere else.
;
; Calculated channels are Wscope's own business - the live scope in
; Motor_Control does not evaluate them. In the fast templates there is only
; one anyway, the low byte of the tick, and the live scope does not need it:
; it unwraps the tick to 32 bits, places samples on the time axis BY TICK,
; breaks the trace at a gap and counts the gaps separately.

[ParLeft]
[ParRight]
[ParList]

;MEASURED - one entry per frame word, order fixed by the firmware
phaseErr = ^4,0.0001,0,1,2,1     ;  0  phase detector error, sin() units
U220     = ^1,0.1,0,3,4,1        ;  1  grid voltage on the secondary, V
iRef     = ^2,0.01,0,5,6,1       ;  2  demanded instantaneous current, A
iSec     = ^2,0.01,0,7,8,1       ;  3  secondary current = current to grid, A
iPri     = ^2,0.01,0,9,10,1      ;  4  primary current, A
m        = ^0,1,0,11,12,1        ;  5  modulation index
duty     = ^0,1,0,13,14,1        ;  6  leg A duty
Vin      = ^1,0.1,0,15,16,1      ;  7  DC link voltage as measured, V
mDC      = ^5,0.00001,0,17,18,1  ;  8  DC component of modulation
dacb     =  0,1,0,19,20,1        ;  9  phase detector reference, ADC codes
uSec     = ^1,0.1,0,21,22,1      ; 10  inverter output voltage, V
iBat     = ^2,0.01,0,23,24,1     ; 11  battery current, A
iMag     = ^2,0.01,0,25,26,1     ; 12  magnetising current, A (see below)
pInst    = ^0,1,0,27,28,1        ; 13  instantaneous output power, W
uOutCor  = ^1,0.1,0,29,30,1      ; 14  island voltage loop correction, V rms
tick     =  0,1,0,31,32,1        ; 15  control tick counter

; pInst is uSec * iSec, the product of the two channels the firmware also
; builds P, Q and S from. Average it over one grid period and you get exactly
; the active power shown in the window. Its 100 Hz ripple is not an artefact:
; a single-phase bridge really does pull power that way, and with a reactive
; load the curve goes negative for part of the period.
;
; Vin is the uBat channel itself, sampled every tick like any other. It used
; to be gt.Udc - the number the current loop divides by - and that is NOT the
; same thing: with UdcSrc = 0 the loop uses the constant UdcFixed, so the trace
; would have shown a flat line instead of the sensor. Fixed 23.09.2026.
;
; Two words were freed the same day: u220_kod (raw codes of the same channel
; that already travels as volts in word 1) and a second copy of the battery
; voltage. One went to pInst straight away, the other went to uOutCor on
; 25.09.2026 when the island voltage loop was closed. 14 words is not a length
; CAN FD has, and the next one down is 12, which would have cost two channels.
;
; uOutCor is what the slow PI adds to the voltage setpoint, in rms volts. Read
; it next to uSec (word 10) and m (word 5): together the three answer why the
; output sits where it does. Rising with load means the loop is working; stuck
; at uOutCorMax means the setpoint cannot be reached - see event gt_uOutSat.
; The fast half of that loop leaves no trace of its own: it divides by the
; instantaneous DC link voltage every tick, and Vin (word 7) is what it sees.
;
; iMag is not a sensor. It is iPri/n - iSec, computed in the firmware from the
; two measured currents and referred to the secondary side. On the plant model
; it equals sim.iMag exactly; on real hardware it is the true magnetising
; current, and it is the channel that shows the core flux drifting away.

; tick MUST stay in the last word. Motor_Control treats a change of the last
; word as "record complete, next data belongs to the next record"
; (Kadr60.cs: ccs.k60Cnt from the last word; CanaAsync.cs: if (_cntRef ==
; ccs.k60Cnt) return). A value that repeats between samples makes the recorder
; wait instead of writing, and the trace crawls.

;CALCULATED - not from the frame, defined here
tick256 = @0,[tick] and 255
Null = @0,0
mPos=@@
mPos1=@@@

[New]
