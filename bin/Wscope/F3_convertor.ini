; Wscope channel map for the K56 oscilloscope frame (CAN ID 103, 12 words).
;
; Master copy lives here, in the repository, so it travels with the project to
; the other machine. Wscope loads it from its own folder, so working copy is
;
;     C:\Work\K55\bin\Wscope\F3_convertor.ini
;
; The name is fixed: Motor_Control picks the file by frame name
; (Kadr60.cs, f2kadrName == "F3_convertor"). Copy this file over that one
; after changing anything here.
;
; ASCII ONLY, comments in English - on purpose, same call as for run-can.cmd.
; The other .ini files in that folder are Windows-1251, the repository is
; UTF-8, and this one has to live in both places. ASCII removes the
; re-encoding step from the copy and cannot turn into mojibake either way.
; The reasoning in Russian belongs with the frame itself:
; firmware_c2000/algo/1ph_Sin.c, the layout table before the control ISR.
;
; Format: <Name>=<format>,<K>,<A>,<nHi>,<nLo>,color
;   ^        signed 16-bit
;   format   digits after the decimal point
;   K, A     value = code * K + A
;   nHi,nLo  byte positions in the frame, 1-based, high byte first
;            word i occupies bytes 2i+1 and 2i+2

[ParLeft]
[ParRight]
[ParList]

;MEASURED - one entry per frame word, order fixed by the firmware
phaseErr = ^4,0.0001,0,1,2,1     ;  0  phase detector error, sin() units
uGrid    = ^1,0.1,0,3,4,1        ;  1  grid voltage, V
iRef     = ^2,0.01,0,5,6,1       ;  2  demanded instantaneous current, A
iSec     = ^2,0.01,0,7,8,1       ;  3  secondary current = current to grid, A
iPri     = ^2,0.01,0,9,10,1      ;  4  primary current, A
m        = ^0,1,0,11,12,1   	 ;  5  modulation index
duty     = ^0,1,0,13,14,1   	 ;  6  leg A duty
vin      = ^1,0.1,0,15,16,1      ;  7  battery voltage, V
mDC      = ^5,0.00001,0,17,18,1  ;  8  DC component of modulation
dacb     =  0,1,0,19,20,1        ;  9  phase detector reference, ADC codes
u220_kod =  0,1,0,21,22,1        ; 10  second reference, ADC codes
tick     =  0,1,0,23,24,1        ; 11  control tick counter

; tick MUST stay in the last word. Motor_Control treats a change of the last
; word as "record complete, next data belongs to the next record"
; (Kadr60.cs: ccs.k60Cnt = U(11); CanaAsync.cs: if (_cntRef == ccs.k60Cnt)
; return). A value that repeats between samples makes the recorder wait
; instead of writing, and the trace crawls.

;CALCULATED - not from the frame, defined here
tick256 = @0,[tick] and 255
Null = @0,0
mPos=@@
mPos1=@@@

[New]
