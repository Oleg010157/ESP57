; Карта каналов Wscope для быстрой ленты однофазного моста
; (CAN ID 103, 16 слов, 32 байта, DLC 13).
;
; Расширена с 12 до 16 слов 23.09.2026: в кадре было всего два тока и одно
; напряжение, теперь есть ещё выход инвертора и ток АКБ. Слова 0..9 остались на
; прежних местах, так что старые настройки .wsc читают их верно. Счётчик такта
; переехал со слова 11 на слово 15 - он ОБЯЗАН быть последним, см. ниже.
;
; Файл отслеживается в репозитории, и Wscope читает его из этой же папки -
; копировать никуда не нужно: bin/Wscope/ и есть и оригинал, и рабочая копия, и
; он едет вместе с проектом на другую машину. (Раньше здесь стоял путь
; C:\Work\K55\... - это от старого проекта.)
;
; Имя файла задано жёстко: Motor_Control выбирает его по имени набора кадра
; (Kadr60.cs, f2kadrName == "F3_convertor").
;
; СОВПАДАТЬ ОБЯЗАНЫ ТРИ МЕСТА, имён внутри кадра нет:
;   прошивка   INVERTOR_CCS/my_Files/1ph_Sin.c, блок F3 в прерывании управления
;   разбор     Oleg/Kadr60.cs, ProcessFrame103
;   этот файл
;
; Живой осциллограф в Motor_Control четвёртым местом НЕ является: он читает этот
; самый файл (Scope/IniChannelMap.cs) и разойтись с Wscope не может в принципе.
; Свою зашитую таблицу он имел ровно один день, и этого дня хватило.
;
; ОСТОРОЖНО С ПОЗИЦИЯМИ БАЙТ, если возьмёте их куда-то ещё: они описывают
; раскладку в записанном .spl, где рекордер хранит каждое слово СТАРШИМ БАЙТОМ
; ВПЕРЁД (ASt_MainF.cs меняет байты перед Buffer.BlockCopy). На шине CAN слова
; лежат младшим байтом вперёд. Поэтому живой осциллограф выводит номер слова,
; (nHi - 1) / 2, и читает кадр в своём порядке.
;
; У m и duty до 04.10.2026 стоял K = 1, то есть они рисовались сырыми кодами
; 0..10000, хотя все соседи отмасштабированы (phaseErr 1e-4, mDC 1e-5), а
; grid_tie.txt, раздел 6.2, указывает для обоих 1e-4. Исправлено здесь, и это
; заодно перерисовывает две кривые на старых записях - в этом и смысл.
;
; КОДИРОВКА cp1251, комментарии по-русски - как у соседних шаблонов в этой же
; папке (F3_invertor.ini, F1_convertor.ini и прочие). Раньше файл был ASCII:
; считалось, что его надо копировать между репозиторием и папкой Wscope, и
; ASCII снимал вопрос перекодировки. Копировать давно не надо - папка одна, -
; и повод отпал. Если будете править: редактор должен быть в cp1251, иначе
; кириллица превратится в кашу.
;
; ИЗМЕРЯЕМЫЙ канал: <Имя>=<format>,<K>,<A>,<nHi>,<nLo>,цвет
;   ^        знаковый 16-битный
;   format   знаков после запятой
;   K, A     значение = код * K + A
;   nHi,nLo  позиции байт в кадре, с единицы, старший байт первым
;            слово i занимает байты 2i+1 и 2i+2
;
; ВЫЧИСЛЯЕМЫЙ канал: <Имя>=@<format>,<выражение>
;
; Внутри выражения ссылка на канал бывает двух видов, и разница НЕ косметическая:
;
;     [имя]     СЫРОЙ КОД, ровно как пришёл в кадре
;     [`имя]    значение ПОСЛЕ линейного преобразования, то есть код * K + A
;
; То есть [`U220] - это 310 вольт там, где [U220] даёт 3100. Ошибётесь видом -
; и кривая будет молча неверной в K раз. Это худший вид ошибки измерения: она
; всё ещё выглядит как сигнал.
;
; Различие есть только у ИЗМЕРЯЕМЫХ каналов: у вычисляемого нет ни кода, ни K,
; и поэтому ни один вычисляемый канал ни в одном из этих файлов обратной
; кавычки не носит.
;
; Там, где K = 1, обе формы совпадают, и файлы пользуются ими вперемешку:
; [tick], [IsrTic], [Pabc1], [yTorq] - все с K = 1. Потому в этих местах
; разнобой безобиден, а по-настоящему он кусает один раз - в F3_Dead_Time.ini,
; где slipF фильтрует [slip1] с K = 0.002 без кавычки и потому сходится к
; сырому коду, в 500 раз больше физики.
;
; Записано здесь 04.10.2026, потому что исходников Wscope (Delphi) больше нет,
; а правило нигде больше не зафиксировано.
;
; ---------------------------------------------------------------------------
; НАСТРОЙКИ ВИДА, то есть то, что пишет окно Config. Не в этом файле - они
; лежат рядом, в WScope{E,F,2}.ini, три независимых набора, и все gitignored:
; они пользовательские. Причина записи та же - больше нигде этого нет.
;
;     [ChList]   Ch<слот>=<имя канала>, слоты 0..5 и 256..261,
;                то есть верхняя группа и нижняя
;     [Colors]   Ch<слот>=<TColor>, причём TColor у Delphi это $00BBGGRR -
;                BGR, а не RGB. Прочитать наоборот - значит поменять местами
;                красный с синим на всех кривых.
;     [<имя>]    k, YAdd - размах по вертикали, В СЫРЫХ КОДАХ:
;                    k = 255 / (rawMax - rawMin)       YAdd = -rawMin
;
; Обратно: rawMin = -YAdd, rawMax = 255/k - YAdd, дальше в физику через K и A
; из этого файла. Минимум и максимум, которые показывает окно Config, и есть
; результат этого пересчёта, а не отдельно хранимые значения.
;
; Сверено с окном: iMag k=0.6375 YAdd=200 дают коды -200..200, что при K=0.01
; есть -2.00..2.00 А - ровно как там показано. iSec 0.1275/1000 -> -10..10 А.
; tick256 1/0 -> 0..255.
;
; Цвет принадлежит СЛОТУ, а не каналу: в [Colors] есть записи и для пустых
; слотов.
;
; Живой осциллограф ЧИТАЕТ это как начальную настройку, а пишет свой файл
; (bin/Debug/Scope/<шаблон>.view.ini). Писать сюда ему нельзя: Wscope
; переписывает файл целиком при выходе, и правки одной программы молча
; пропадали бы при закрытии другой.
;
; ВЫЧИСЛЯЕМЫЕ КАНАЛЫ: живой осциллограф считает ровно две формы, и граница
; проведена намеренно.
;
;     Null    = @0,0                 постоянная
;     tick256 = @0,[tick] and 255    младшие разряды другого канала
;     isr256  = @0,[IsrTic] and $FF  то же, маска шестнадцатеричная
;
; Их видно по тексту выражения целиком, угадывать нечего - поэтому считает.
; Всё остальное в языке не трогает: состояние (БИХ-фильтры, накопители, бегущий
; min/max), историю отсчётов [x~-1], условия if(a;b;c) и номер отсчёта (@@).
; Посчитать наполовину верно значит нарисовать правдоподобную ложь, а это
; худший вид ошибки измерения. Окно Config показывает все вычисляемые каналы
; красным, как и Wscope, и не даёт положить в поле те, которые не считает.
;
; Заметьте, что [x] - это СЫРОЙ КОД, а не отмасштабированное значение, см.
; выше. Для маски это единственно верно: младший байт счётчика есть свойство
; кода, а не величины.
;
; Сам себе tick256 осциллографу не нужен: он разворачивает такт в 32 бита,
; ставит отсчёты на ось времени ПО ТАКТУ, рвёт линию на пропуске и считает
; разрывы отдельно. Рисуется он потому, что оператор попросил его показать.

[ParLeft]
[ParRight]
[ParList]

;ИЗМЕРЯЕМЫЕ - по одной записи на слово кадра, порядок задан прошивкой
phaseErr = ^4,0.0001,0,1,2,1     ;  0  ошибка детектора фазы, единицы sin()
U220     = ^1,0.1,0,3,4,1        ;  1  сеть, приведённая ко вторичке, В
iRef     = ^2,0.01,0,5,6,1       ;  2  заданный мгновенный ток, А
iSec     = ^2,0.01,0,7,8,1       ;  3  ток вторички = ток в сеть, А
iPri     = ^2,0.01,0,9,10,1      ;  4  ток первички, А
m        = ^4,0.0001,0,11,12,1   ;  5  индекс модуляции
duty     = ^4,0.0001,0,13,14,1   ;  6  заполнение плеча A
Vin      = ^1,0.1,0,15,16,1      ;  7  напряжение звена, ИЗМЕРЕННОЕ, В
mDC      = ^5,0.00001,0,17,18,1  ;  8  постоянная составляющая модуляции
dacb     =  0,1,0,19,20,1        ;  9  опора детектора фазы, коды АЦП
uSec     = ^1,0.1,0,21,22,1      ; 10  выход инвертора, В
iBat     = ^2,0.01,0,23,24,1     ; 11  ток АКБ, А
iMag     = ^2,0.01,0,25,26,1     ; 12  ток намагничивания, А (см. ниже)
pInst    = ^0,1,0,27,28,1        ; 13  мгновенная мощность на выходе, Вт
uOutCor  = ^1,0.1,0,29,30,1      ; 14  поправка контура U острова, В rms
tick     =  0,1,0,31,32,1        ; 15  счётчик тактов управления

; pInst - это uSec * iSec, произведение тех же двух каналов, из которых
; прошивка считает P, Q и S. Усредните эту кривую за период сети - получите
; ровно активную мощность, что стоит в окне. Пульсация 100 Гц в ней не
; артефакт: однофазный мост действительно так и тянет мощность, а при
; реактивной нагрузке кривая часть периода идёт в минус.
;
; Vin - это сам канал uBat, преобразуемый каждый такт, как и любой другой.
; Здесь стояло gt.Udc - то число, НА КОТОРОЕ КОНТУР ДЕЛИТ, - и это не одно и
; то же: при UdcSrc = 0 контур берёт константу UdcFixed, и в ленту шла бы
; прямая линия вместо сигнала датчика. Исправлено 23.09.2026.
;
; Два слова освободились в тот же день: u220_kod (сырые коды того же канала,
; который уже едет вольтами в слове 1) и вторая копия напряжения АКБ. Одно тут
; же занял pInst, второе - uOutCor 25.09.2026, когда замкнулся контур
; напряжения острова. Длины в 14 слов у CAN FD нет, ближайшая вниз - 12, и она
; стоила бы двух каналов.
;
; uOutCor - это то, что медленный ПИ добавляет к уставке напряжения, в
; действующих вольтах. Читать его надо рядом с uSec (слово 10) и m (слово 5):
; втроём они и отвечают, почему выход стоит не там, где заказано. Растёт вместе
; с нагрузкой - контур работает; упёрся в uOutCorMax - уставка недостижима, см.
; событие gt_uOutSat. Быстрая половина того же контура своего следа не
; оставляет: она каждый такт делит на мгновенное напряжение звена, а что она
; при этом видит - показывает Vin (слово 7).
;
; iMag - не датчик. Это iPri/n - iSec, считается в прошивке из двух измеренных
; токов и приводится ко вторичке. На модели он в точности равен sim.iMag, на
; железе это настоящий ток намагничивания, и именно по нему виден уход потока в
; сердечнике.

; tick ОБЯЗАН оставаться в последнем слове. Motor_Control считает изменение
; последнего слова признаком «запись готова, дальше данные следующей записи»
; (Kadr60.cs: ccs.k60Cnt из последнего слова; CanaAsync.cs: if (_cntRef ==
; ccs.k60Cnt) return). Величина, способная повториться у соседних отсчётов, на
; этом месте заставит рекордер ждать вместо записи, и лента поползёт.

;ВЫЧИСЛЯЕМЫЕ - не из кадра, задаются здесь
tick256 = @0,[tick] and 255
Null = @0,0
mPos=@@
mPos1=@@@

[New]
