;convert parametr cod to phizical value
;<Name>=<format>,<K>,<A>,<nHi>,<nLo>,color
;<Name>=@<format>,expression
;format- число знаков после запятой
;^ - for int
;['var] - phisical meaning of variables 
;[var] - cod meaning of variables
;[var~+5] shift variables right on 5 steps 
;[var~-5] shift variables left on 5 steps
;@0,[var]=[var]*0.5   var(i)=var(i-1)*0.5   Вычисление текущего значения по предыдущему
;mPos=@@  - номер отсчёта с начала файла
;mPos1=@@@ - номер отсчёта с начала экрана
 

[ParLeft]
[ParRight]
[ParList]

;MEASURED VARIABLES
;mbox3 -----------------------------------------
Ia_kod =   ^0,1,0,1,2,1  	;1 фазный ток
Ib_kod =   ^0,1,0,3,4,1 	;2 фазный ток	
Idc_kod =  ^0,1,0,5,6,1 	;3 фазный ток 
Udc_kod = ^0,1,0,7,8,1 		;4 

;mbox4 -----------------------------------------
Va = ^1,0.1,0,9,10,1 	;5 напряжение фазы А, Вольт
Vb = ^1,0.1,0,11,12,1	;6 напряжение фазы В, Вольт
Idc_rf = ^1,0.02,0,13,14,1	;7 
Udc_rf = ^1,0.02,0,15,16,1	;8 угол фазы напряжения
 
;mbox5 -----------------------------------------
Vin_kod   = ^0,1,0,17,18,1	;9 частота поля инвертора
Vin_rf= ^2,0.02,0,19,20,1	;10  
duty  = 0,1,0,21,22,1		;11 
IsrTic= 0,1,0,23,24,1		;12 счётчик кадров
 

;CALCULATED
Isr256 = @0,[IsrTic] and 255 


Null = @0,0
mPos=@@
mPos1=@@@

[New]





