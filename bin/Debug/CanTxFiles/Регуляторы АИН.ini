//Имя= Мин,Макс,команда,Мод,Цвет,number
//Цвет : 0- black, 1- red, 2-gold,3- salat, 4- green, 5- blue

// Коэффициенты ДВУХ МЕДЛЕННЫХ КОНТУРОВ однофазного моста. Оба живут в задаче
// CLA (CLA/Task1.cla), оба считаются раз за период выходного напряжения, оба
// отдают CPU по одному числу, которое тот применяет каждый такт.
//
//     контур напряжения острова   держит действующее на выходе инвертора
//     подавление постоянки        держит поток сердечника по центру
//
// ЧТО ЗНАЧИТ "АИН" В ИМЕНИ ТАБЛИЦЫ - И ЧЕГО ОНО НЕ ЗНАЧИТ.
//
// Это адрес, а не область действия: таблицу открывают, когда налаживают
// автономный режим, и имя отвечает на вопрос "где я её видел". Из двух
// контуров островным является только ПЕРВЫЙ - он работает при gridMode = 0 и
// больше нигде, потому что в сети амплитудой заведует слежение за огибающей
// сети (u220_sample в myADC.c).
//
// А ПОДАВЛЕНИЕ ПОСТОЯНКИ РАБОТАЕТ В ОБОИХ РЕЖИМАХ, и путать тут нельзя:
// трансформатору безразлично, каким режимом ему наливают вольт-секунды. В сети
// контур разрешён во всех состояниях, где мост модулирует, включая GT_SYNC -
// это отдельная история, grid_tie.txt 3.1.7; в острове - при открытых ключах.
// В эту таблицу он попал не по режиму, а по занятию: оба контура медленные,
// оба в CLA, и подбирают их в одном и том же опыте.
//
// Таблица отдельная, а не строки в GridTie.ini, ровно по той же причине, по
// которой отдельно живут Модель.ini и ЦАП.ini: сюда лезут ПОСРЕДИ ОПЫТА,
// подбирая коэффициент по реакции живой машины, а в GridTie.ini - то, что
// задают один раз при наладке и потом не трогают. Искать две строки среди
// трёх десятков каждый раз - значит каждый раз терять время.
//
// КАК ЧИТАТЬ ИМЕНА СТРОК. Префикс говорит, чей это коэффициент:
//
//     uOut*         контур выходного напряжения (uOutRef, uOutCor в прошивке)
//     *DC*, dc*     подавление постоянной составляющей (mDC, kDC)
//
// Имена совпадают с именами полей в прошивке намеренно. Короткие Kp и Ki тут
// не годятся: ровно так же зовутся коэффициенты контура ТОКА в GridTie.ini,
// а это третий регулятор, ни на один из этих двух не похожий.
//
// Разбор обоих контуров - my_Files/grid_tie.txt, разделы 11 и 3.1.
// Номера строк совпадают с таблицей gtPars в KSP/MBOX28.c.
//
// Чтение таблицы: щелчок по заголовку "Знач." - прибор отвечает тем, что у
// него на самом деле. Если строка не вернулась - команды нет в прошивке.
//
// ЧЕГО ЗДЕСЬ НЕТ. Уставка напряжения острова - на движке Gain1 главного окна
// (команда 633): это не настройка, а то, чем управляют. Контур тока сетевого
// режима (PR-регулятор, команды 640..646) остался в GridTie.ini - он работает
// на другой частоте, другим законом и в другом режиме моста, и мешать его
// коэффициенты с этими двумя незачем.

[Active]

// --- контур напряжения острова (АИН), раздел 11 ---------------------------
//
// Управление двухуровневое. КАЖДЫЙ ТАКТ амплитуда пересчитывается по
// МГНОВЕННОМУ напряжению звена - это прямая связь, и она снимает и просадку
// АКБ, и его пульсацию 100 Гц, не имея никаких коэффициентов вообще. РАЗ ЗА
// ПЕРИОД ПИ по действующему добирает то, чего прямая связь не знает: падения
// в трансформаторе и вольт-секундную ошибку мёртвого времени. Здесь - его
// коэффициенты.
//
// Поправка считается в вольтах ДЕЙСТВУЮЩИХ, поэтому коэффициент передачи
// объекта равен единице, и оба числа читаются прямо:
//
//     Kp = 0.3   снять треть ошибки сразу, на первом же периоде
//     Ki = 0.1   добирать десятую часть за период
//
// Установление при этой паре - 5..10 периодов, то есть 0.1..0.2 с.
//
// КАК ПОДБИРАТЬ. Смотреть uSec_rms (поле "rms" панели моста) и uOutCor (слово
// 14 кадра F3, либо отладочный ЦАП, источник 12) на ступеньке нагрузки.
//
//     звон на 100 Гц в форме выхода     Kp велик, уменьшать
//     долго ползёт к уставке            Ki мал
//     перелёт с возвратом               Ki велик при малом Kp
//
// Ноль в обоих полях РАЗМЫКАЕТ контур - это штатный способ померить провал
// напряжения без регулятора и сравнить. Поправка при этом замирает там, где
// её застали; обнулить её можно сменой режима (АИН -> слежение -> АИН).
uOutKp_x1000	= 0,3000,682,0,4,58
uOutKi_x1000	= 0,3000,683,0,4,59

// Потолок поправки, В действующих. Это ПРЕДЕЛ ПОЛНОМОЧИЙ, а не защита: упор
// означает, что уставка недостижима - просел АКБ, мал коэффициент
// трансформации, либо нагрузка больше расчётной (раздел 3.2). Через uOutSat
// периодов ПОДРЯД в упоре в журнал уходит событие 67, БЕЗ ОСТАНОВА: мост при
// этом исправен, просто выдаёт меньше запрошенного.
//
// 60 В при уставке 220 - это 27 %, с большим запасом над теми единицами вольт,
// которые падают в трансформаторе. Увеличивать его бессмысленно: раньше
// поправки в потолок упирается сама амплитуда, см. mMax в GridTie.ini.
uOutCorMax_x10	= 0,2000,684,0,4,60
uOutSatLimit	= 1,1000,685,0,4,61

// --- подавление постоянной составляющей (первичка), раздел 3.1 ------------
//
// РАБОТАЕТ В ОБОИХ РЕЖИМАХ МОСТА, не только в АИН, - см. оговорку в шапке.
//
// Контур ловит постоянную составляющую в СРЕДНЕМ ТОКЕ ПЕРВИЧКИ: ток
// намагничивания течёт только там и во вторичку не трансформируется в
// принципе. Выход - поправка mDC к индексу модуляции, её применяют оба
// формирователя, и в сети, и в острове.
//
// ЗАКОН ПИ, И ПРОПОРЦИОНАЛЬНАЯ ЧАСТЬ ЗДЕСЬ ОБЯЗАТЕЛЬНА. Объект сам по себе
// интегратор (ток намагничивания есть интеграл напряжения), и чистый
// интегратор в регуляторе давал бы нулевое затухание: контур не сходится, а
// КАЧАЕТСЯ. Замерено на модели 24.09.2026 - 1.03 Гц при размахе около 5 А
// постоянки, незатухающее. Уменьшать kDC бесполезно, частота падает как
// корень, затухание остаётся нулевым. Разбор - 3.1.6.
//
//     kDC  = 0.0005   интегральная часть, установление около секунды
//     kDCp = 0.005    пропорциональная, она и даёт затухание (zeta ~0.7)
//
// КАК ПОДБИРАТЬ. Смотреть iPri_av (поле "I1_av" панели моста) и Ucor - то же
// самое в вольтах, mDC*Udc. Возмущение задаётся строкой Uпост в Модель.ini.
// Судить надо по ЗАТУХАНИЮ медленных колебаний около 1 Гц, а не по тому, за
// сколько среднее вернулось к нулю.
//
// ЗНАК КРИТИЧЕН. Контур отрицателен только при верной полярности датчика тока
// (iSign в GridTie.ini). При обратной он становится ПОЛОЖИТЕЛЬНОЙ обратной
// связью и за считанные периоды уезжает в потолок - то есть ровно в тот почти
// вольт, который насыщает сердечник за два периода. Полярность проверяется ДО
// первого включения, а не по факту.
kDC_x1e4	= 0,1000,647,0,3,18
kDCp_x1e4	= 0,1000,681,0,3,56

// Жёсткий потолок |mDC|. Выбран из "сколько нужно для компенсации" (мёртвое
// время просит 0.01, взят двойной запас), а НЕ из "сколько сердечник стерпит":
// 0.02 при звене 48 В это 0.96 В постоянки на первичке, меньше двух периодов
// до насыщения. Поэтому упор означает не "контур старается", а "помеха больше
// всех моих полномочий" - и через dcSat периодов подряд уходит событием 66
// в журнал. Тоже без останова, разбор - 3.1.5.
mDCmax_x1000	= 0,200,648,0,3,19
dcSatLimit	= 1,1000,680,0,3,57

// --- хранение -------------------------------------------------------------
//
// Восемь строк выше ПЕРЕЖИВАЮТ ВЫКЛЮЧЕНИЕ - они лежат во флеше рядом с
// паспортом силовой части и с калибровкой АЦП. Правило то же, что в таблице
// "Силовая часть": правка идёт в ОЗУ и применяется немедленно, а во флеш её
// отправляет строка "Запись". Подбирать кнопками "+/-" можно сколько угодно,
// банк при этом не расходуется.
//
// Коэф_crc - ТОЛЬКО ЧТЕНИЕ, читается щелчком по заголовку "Знач.".
// НОЛЬ значит "коэффициенты не подбирали, работаем на заводских".
//
// Запись сохраняет ВСЮ запись разом - и коэффициенты, и паспорт, и
// калибровку АЦП: во флеше это одна страница. Строка та же самая, что в
// таблице "Силовая часть", и нажать её можно из любой из двух.
//
// Заводские возвращает заводские КОЭФФИЦИЕНТЫ в ОЗУ, паспорт не трогает -
// у него своя строка сброса. Во флеше остаётся прежнее; чтобы сброс стал
// постоянным, нажмите следом "Запись".
Коэф_crc	= 0,32000,697,0,3,83
Запись		= 0,1,693,0,1,84
Заводские	= 0,1,699,0,1,85

[Hidden]
