//Имя= Мин,Макс,команда,Мод,Цвет,number
//Цвет : 0- black, 1- red, 2-gold,3- salat, 4- green, 5- blue

// Масштабы каналов АЦП. Единственная таблица тарировки - Tarirovka.ini
// удалён, он содержал те же команды под другими именами.
//
// Имена совпадают с полями kadc в my_Files/myADC.h, номера команд - с case
// в KSP/MBOX28.c. При изменении одного менять и другое.
//
// kSum (201) - индикатор контрольной суммы, запись прошивка игнорирует.
// НОЛЬ ЗДЕСЬ ЗНАЧИМ: он означает, что каналы после заводских значений ещё не
// калибровались. Поэтому сумму ставит только тот, кто действительно калибрует.
//
// RESET (206) - строка-переключатель, а не значение. Поставьте 1: масштабы
// вернутся к заводским, kSum станет 0, и строка сама вернётся в 0 - прибор
// отвечает нулём. Нули каналов при этом НЕ ТРОГАЮТСЯ, для них свой сброс
// в Offsets.ini.
//
// Команды 204 (Store) и 205 (Recall) в таблицу не выносятся: это действия, а
// не значения, и они есть в меню. Нули каналов - в Offsets.ini.

