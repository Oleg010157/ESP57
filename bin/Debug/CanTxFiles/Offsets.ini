//Имя= Мин,Макс,команда,Мод,Цвет,number
//Цвет : 0- black, 1- red, 2-gold,3- salat, 4- green, 5- blue

// Нули каналов АЦП.
//
// У строк iPri..uBat два действия:
//
//   ГАЛОЧКА "М"  откалибровать ЭТОТ канал. Прибор усредняет сигнал по 256
//                отсчётам и берёт результат за ноль. Галочка старше ручного
//                ввода: поставили - канал калибруется, что было в поле
//                значения, уже не важно.
//
//   ЗНАЧЕНИЕ     записать ноль вручную. Нужно там, где автокалибровку не
//                провести: подстроить по образцовому прибору, повторить
//                значение с другой платы, вернуть записанное в журнал.
//
// Откалибровать всё сразу - меню "Откалибровать все датчики".
//
// ВХОД КАЛИБРУЕМОГО КАНАЛА ДОЛЖЕН БЫТЬ ОБЕСТОЧЕН: за ноль принимается то, что
// на входе. На стенде это в первую очередь про u220 - на A0 сидит отладочная
// синусоида с ЦАП, и калибровать по ней ноль сети смысла нет. Поэтому каналы
// и разведены по галочкам: калибруйте те, что готовы.
//
// Таблица перечитывается сама после калибровки, ручной правки и сброса -
// значения в ней всегда те, что в приборе.
//
// Значение строки - это содержимое регистра ADCPPBxOFFREF: сырой код АЦП,
// соответствующий нулю на входе. Регистр вычитается из отсчёта аппаратно, ещё
// до того как результат попадёт в программу:
//
//     iPri_kod = ADCRESULT - offsets.iPri
//
// Отсюда и диапазон 0..4095: результат АЦП 12-битный, большее в регистр просто
// не помещается. И заводские значения: 2048 у токов (датчик двуполярный, ноль
// в середине шкалы), 110 у напряжений (однополярный).
//
// CRC - индикатор, запись прошивка игнорирует: сумму пересчитывает сама.
//
// Раньше в этом файле стояли команды 198..205 - то есть МАСШТАБЫ kadc, а не
// нули. Таблица была копией тарировочной под чужим именем и к смещениям
// каналов отношения не имела.
//
// RESET (213) - строка-переключатель, а не значение. Поставьте 1: нули
// вернутся к заводским, CRC станет 0, и строка сама вернётся в 0 - прибор
// отвечает нулём. Масштабы при этом НЕ ТРОГАЮТСЯ, для них свой сброс
// в kADC.ini.
//
// Имена совпадают с полями offsets в my_Files/myADC.h, номера - с case
// в KSP/MBOX28.c.

[Active]

iPri	= 0,4095,207,1,4,2
iSec	= 0,4095,208,1,4,3
iBat	= 0,4095,209,1,5,4
u220	= 0,4095,210,1,5,1
uBat	= 0,4095,211,1,2,7
CRC	= 0,10000,212,0,1,6
RESET	= 0,1,213,0,1,8




