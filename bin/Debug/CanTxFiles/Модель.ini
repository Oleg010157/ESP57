//Имя= Мин,Макс,команда,Мод,Цвет,number
//Цвет : 0- black, 1- red, 2-gold,3- salat, 4- green, 5- blue

// Модель силовой части: АКБ - H-мост - трансформатор - нагрузка.
// Реализация - my_Files/plant_sim.c, разбор и порядок опытов - plant_sim.txt.
//
// ЗАЧЕМ. Проверить алгоритмы моста без силовой части. Со включённой моделью
// прибор считает токи и напряжения сам и подставляет их вместо отсчётов АЦП,
// а контур тока, автомат подключения, подавление постоянной составляющей и
// защиты работают ровно так же, как работали бы на железе. Показания в окне
// Motor_Control при этом настоящие - в том смысле, что это те самые величины,
// которые увидели бы датчики.
//
// ЧТО ЗДЕСЬ ЛЕЖИТ - ЖЕЛЕЗО, А НЕ НАСТРОЙКИ КОНТУРА. Это главное, что надо
// понять про эту таблицу. У контура есть своё число - UdcFixed в
// GridTie.ini, - и оно выражает его ПРЕДСТАВЛЕНИЕ о звене. Здесь стоит то,
// что есть на самом деле. Обычно они совпадают, а их расхождение - это
// отдельный опыт в одно нажатие:
//
//   Uвх = 350, UdcFixed = 480   просевший АКБ, контур о том не знает
//
// ТРАНСФОРМАТОР ТАК РАЗВЕСТИ НЕЛЬЗЯ (с 08.10.2026). Строки n, Lрасс, Rобм и
// Lнамагн - те же переменные паспорта, что в "Силовая часть.ini" (а n - ещё
// и в GridTie.ini): правка любой меняет число сразу и для модели, и для
// алгоритма управления. На модели - на ходу, при работающем мосту; на железе
// (Модель = Выкл) - только при закрытых ключах. Во флеш - кнопкой сохранения
// паспорта, как всегда.
//
// Всё, что можно привести ко вторичке (сторона 220 В), приведено к ней.
//
// ЧЕГО В МОДЕЛИ НЕТ: насыщения сердечника, потерь в стали, мёртвого времени
// как такового (его действие задаётся строкой Uпост), сопротивления АКБ.
//
// Значение в таблице - целое, поле в приборе - float, поэтому у каждой строки
// свой масштаб (он в имени). Номера строк совпадают с таблицей gtPars в
// KSP/MBOX28.c.
//
// Чтение таблицы: щелчок по заголовку "Знач." - прибор отвечает тем, что
// у него на самом деле. Если строка не вернулась - команды нет в прошивке.

[Active]

// ГЛАВНЫЙ КЛЮЧ. 1 - все шесть величин тракта берутся из модели: токи первички
// и вторички, напряжение на выходе инвертора, напряжение и ток АКБ. Канал сети
// U220 не подменяется никогда - он ведёт синхронизацию, и на стенде это
// имитация от ЦАП.
//
// НА ЖИВОМ МОСТЕ - ВЫКЛ. Иначе защиты будут стеречь числа в ОЗУ, а не токи
// в железе.
//
// Ключи моста модель учитывает: при закрытых IGBT обмотка разомкнута, и оба
// тока тождественно нулевые. Чтобы увидеть ток, мост надо включить кнопкой
// питания в окне Motor_Control, как и на железе.
Модель		= 0,1,667,0,1,45, Выкл, Вкл

// --- источник -------------------------------------------------------------
// Напряжение АКБ на входе моста, 0.1 В. 480 = 48 В.
//
// Это НАСТОЯЩЕЕ напряжение звена. Тем, чем контур делит при расчёте индекса
// модуляции, управляет строка UdcFixed_x10 в GridTie.ini - при UdcSrc = 0.
// Поставьте там UdcSrc = 1, и контур начнёт брать напряжение из канала uBat,
// который на модели пишет она же: получится полностью замкнутая петля
// модель - датчик - контур.
Uвх_x10		= 0,1000,674,0,2,46

// --- трансформатор --------------------------------------------------------
// Коэффициент трансформации Uвтор/Uперв, x100. 700 = 1:7.
// Это строка ПАСПОРТА: правит то же число, что n в GridTie.ini и в "Силовая
// часть.ini", - контуру и модели разом. Как и три строки ниже.
n_x100		= 10,3000,675,0,5,47

// Индуктивность рассеяния, приведённая ко вторичке, мкГн. 8000 = 8 мГн.
// Через неё течёт весь рабочий ток, и она же определяет, насколько быстро
// контур может им управлять: Kp = 2*PI*полоса*L.
Lрасс_мкГн	= 0,32000,668,0,5,48

// Активное сопротивление обмоток там же, мОм. 500 = 0.5 Ом.
Rобм_мОм	= 0,32000,669,0,5,49

// Индуктивность намагничивания, приведённая ко вторичке, мГн. 1400 = 1.4 Гн,
// это порядок для трансформатора 3 кВт 220 В (ток холостого хода около 0.5 А).
//
// Ради неё модель и переписана. Ток намагничивания - интеграл приложенного
// напряжения, поэтому постоянная составляющая уходит в него линейно и без
// предела, ровно как поток в сердечнике. Именно этот ток видит на первичке
// контур подавления DC. Ноль в этой строке убирает ветвь целиком, и ток
// первички становится тождественно равен n * ток вторички - как в модели
// до 23.09.2026.
Lнамагн_мГн	= 0,32000,676,0,5,50

// --- нагрузка -------------------------------------------------------------
// Что висит на выходе моста, когда контактор РАЗОМКНУТ, то есть в режиме АИН
// и в слежении. При замкнутом контакторе нагрузкой служит сеть, и эти три
// строки не при делах.
//
// ХХ - холостой ход: цепи нет, ток вторички тождественно ноль. Ток
// намагничивания при этом течёт - это и есть ток холостого хода.
Нагрузка	= 0,2,677,0,4,51, ХХ, R, R+L

// Сопротивление нагрузки, 0.01 Ом. 1600 = 16 Ом, то есть 3 кВт при 220 В.
// Пересчёт: R = U*U/P, для 220 В это 48400/P.
Rнагр_x100	= 0,32000,678,0,4,52

// Индуктивность нагрузки, мГн. Работает только при "Нагрузка = R+L".
// Для cos φ на 50 Гц: L = R*tg φ/314. При 16 Ом и cos φ = 0.8 это 38 мГн.
Lнагр_мГн	= 0,32000,679,0,4,53

// --- возмущение -----------------------------------------------------------
// Искусственная постоянная составляющая в приложенном напряжении, 0.01 В на
// вторичке. Так ведёт себя асимметрия мёртвого времени.
//
// Это возмущение по НАПРЯЖЕНИЮ, и это принципиально. Смещение, внесённое в
// измерение тока, контур подавления DC занулить не смог бы в принципе: он
// просто упёрся бы в mDCmax, и опыт ничего бы не доказал.
//
// Ожидаемый ответ: mDC уходит в -Uпост/(n*Udc), среднее за период значение
// тока первички возвращается к нулю. При 5 В, n = 7 и Udc = 48 это -0.0149.
Uпост_x100	= -3000,3000,670,0,3,54

// --- запись формы ---------------------------------------------------------
// Кольцевой буфер на два периода сети (200 тактов, 40 мс) для графика CCS:
// заданный ток, измеренные токи обеих обмоток и индекс модуляции.
// Заполняется в сетевом режиме. Как смотреть - grid_tie.txt, раздел 6.1.
//
// "снимок" - ждущая развёртка, как у осциллографа. Поставили "снимок" и
// спокойно делаете опыт: запись ждёт события - изменения тока Iset или
// Iq либо состояния автомата (авария тоже). Iset идёт за движком Iref не
// сразу, а на ближайшем переходе сети через ноль, - снимок ждёт именно
// его, и ступенька тока ложится на отсчёт 50. После события буфер
// дописывается и запись встаёт: 10 мс ДО и 30 мс ПОСЛЕ. Готовность видна
// по "стоп" после чтения таблицы (щелчок по "Знач."). Останавливать
// процессор не нужно - нажать обновление на графике.
Трасса		= 0,2,671,0,0,55, стоп, по_кругу, снимок

