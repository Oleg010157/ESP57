//Имя= Мин,Макс,команда,Мод,Цвет,number
//Цвет : 0- black, 1- red, 2-gold,3- salat, 4- green, 5- blue

// ПАСПОРТ СИЛОВОЙ ЧАСТИ - описание КОНКРЕТНОЙ машины, стоящей перед вами.
//
// Семь чисел, которые отвечают на вопрос "а что это вообще за инвертор".
// До 25.09.2026 их не было вовсе: прошивка знала ровно один трансформатор
// 1:7 и ровно три киловатта, потому что так было написано литералами в
// grid_tie_init() и plant_sim_init().
//
// ПРАВКА ИДЁТ В ОЗУ, ВО ФЛЕШ - ОТДЕЛЬНОЙ СТРОКОЙ "Запись".
//
// Любое значение здесь применяется НЕМЕДЛЕННО: прибор перестраивается, пороги
// защит и запас по модуляции пересчитываются, видно сразу. Но во флеш ничего
// не уходит, пока не нажали "Запись". Поэтому подбирать кнопками "+/-" можно
// сколько угодно - банк при этом не расходуется, - а неудачную правку
// отменяет строка "Откат".
//
// Записанное поднимается при следующем включении САМО - без пульта, без CAN,
// без единой команды. Иначе и нельзя: прибор должен работать автономно.
//
// Разбор целиком - my_Files/power_par.txt.

[Active]

// --- трансформатор --------------------------------------------------------
// Всё приведено КО ВТОРИЧКЕ (сторона 220 В) - там же, где живут контуры, и
// лишних коэффициентов в уравнениях не остаётся.
//
// Lрасс и Rобм - не украшение паспорта, а то, что контур напряжения
// вынужден компенсировать под нагрузкой. Именно они определяют, сколько
// вольт теряется на номинале: поправка uOutCor в установившемся режиме
// равна как раз этому падению.
//
// Lнамагн описывает ветвь намагничивания - ту самую, где живёт постоянная
// составляющая, губящая сердечник (grid_tie.txt, 3.1). На модели её роль
// видна сразу, на железе - через средний ток первички.
n_x100		= 10,3000,686,0,5,70
Lрасс_мкГн	= 0,32000,687,0,5,71
Rобм_мОм	= 0,32000,688,0,5,72
Lнамагн_мГн	= 0,32000,689,0,5,73

// --- номиналы прибора -----------------------------------------------------
// Ради этих трёх строк паспорт и заведён отдельно от "просто параметров
// железа". Из них ВЫВОДЯТСЯ, а не задаются руками:
//
//     ImaxSec = 1.41*Pном/Uвых * 1.3     отсечка по току вторички
//     ImaxPri = n * ImaxSec              она же по первичке
//     Rнагр   = Uвых^2 / Pном            номинальная активная для модели
//     уставка напряжения острова          = Uвых
//
// Запас 30 % - то же число, что стояло в прежнем литерале ("3 кВт -> 19.3 А
// пика, запас 30 %"). Задали 5 кВт - пороги пересчитались сами, и не
// осталось способа забыть их поправить.
//
// ВНИМАНИЕ: пороги ImaxPri/ImaxSec есть и в GridTie.ini отдельными строками.
// Править их там можно, но правка живёт до следующей записи паспорта.
//
// Pном идёт БЕЗ МАСШТАБА, в ваттах: 32 кВт влезает в short с запасом, а
// десятые доли ватта в паспорте смысла не имеют.
Pном_Вт		= 0,32000,690,0,4,74
Uвых_x10	= 0,3000,691,0,4,75
Uзвена_x10	= 0,1000,692,0,4,76

// --- хранилище: действия --------------------------------------------------
// Строки-кнопки: послать 1, значение обратно приходит нулём - команда уже
// отработана, держать её взведённой незачем.
//
// Запись   сохранить во флеш то, что сейчас в ОЗУ. Пишется ВСЯ настройка
//          разом - и паспорт, и коэффициенты регуляторов, и калибровка АЦП:
//          во флеше это одна запись.
// Откат    перечитать из флеша и применить, отбросив правки в ОЗУ. Если во
//          флеше пусто - встанут заводские.
// Заводские вернуть заводской паспорт и коэффициенты В ОЗУ. Во флеше при этом
//          остаётся прежняя настройка, и после перезапуска она вернётся;
//          чтобы сброс стал постоянным, нажмите следом "Запись".
Запись		= 0,1,693,0,1,77
Откат		= 0,1,694,0,1,78
Заводские	= 0,1,695,0,1,79

// --- хранилище: индикаторы, ТОЛЬКО ЧТЕНИЕ ---------------------------------
// Читаются щелчком по заголовку "Знач.", как сумма kadc в kADC.ini.
//
// Паспорт_crc и Коэф_crc: НОЛЬ значит "работаем на заводских", любое другое
// число - "задано". Две суммы независимы: паспорт и коэффициенты настраивают
// порознь, и видно, что именно ещё не трогали.
//
// Хранилище - два байта в одном слове:
//     младший   что нашлось во флеше при старте
//               0 прочитано, 1 пусто, 2 запись есть, но не наша
//     старший   чем кончилась последняя запись
//               0 успех, 1 банк стёрт, 3 сохранять нечего, 4 ошибка флеша
// То есть 0 после включения без записей означает "прочитано из флеша",
// а 1 - "флеш пуст, прибор не настраивался".
Паспорт_crc	= 0,32000,696,0,3,80
Коэф_crc	= 0,32000,697,0,3,81
Хранилище	= 0,32000,698,0,3,82

// --- ЧТО ПОСМОТРЕТЬ ПОСЛЕ ЗАПОЛНЕНИЯ --------------------------------------
//
// Паспорт умеет отвечать на вопрос "а выйдет ли вообще" ДО включения моста
// и без прогона модели. Два числа в отладчике:
//
//     mNom    требуемый индекс модуляции на холостом ходу
//     mLoad   он же при номинальной АКТИВНОЙ нагрузке
//
// Больше mMax (0.95) - уставка недостижима в принципе: не хватает либо
// коэффициента трансформации, либо напряжения звена. Лечится это железом,
// а не коэффициентами регулятора (grid_tie.txt, 3.2).
//
// Для примера, нынешний стенд: n = 7, 48 В, 3 кВт дают mLoad = 0.966 при
// потолке 0.95 - то есть 220 В под полной нагрузкой не выходят. При n = 8.5
// выходит mLoad = 0.795, и модель честно держит 220 В.
//
// НА ИНДУКТИВНОЙ НАГРУЗКЕ ХУЖЕ, и заметно: падение на рассеянии там
// коллинеарно реактивной части нагрузки и вычитается целиком, а не вторым
// порядком. mLoad этого НЕ ловит - он про активную. Для реактивной гоняйте
// модель, она для того и есть (Модель.ini, строка Нагрузка = R+L).

[Hidden]
