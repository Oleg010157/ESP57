// --- источники опоры и звена ----------------------------------------------
// UdcSrc: 0 = константа UdcFixed (стенд), 1 = канал uBat.
// refSrc: 0 = опора daca (стенд), 1 = измеренный U220 (реальная сеть).
//
// UdcFixed - это ПРЕДСТАВЛЕНИЕ КОНТУРА о напряжении звена, то, чем он делит
// при расчёте индекса модуляции. На модели настоящее напряжение задаётся
// отдельно, строкой Uвх в таблице Модель.ini, и их расхождение - отдельный
// опыт: просевший АКБ, о котором контур не знает.
UdcSrc		= 0,1,664,0,2,35
UdcFixed_x10	= 0,1000,665,0,2,36
refSrc		= 0,1,666,0,2,37

