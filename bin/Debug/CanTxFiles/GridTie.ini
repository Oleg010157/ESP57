// отдельную таблицу Модель.ini - вместе с записью формы в кольцевой буфер.
// Причина та же, по которой отдельно живёт ЦАП.ini: параметры железа и
// коэффициенты контура - разные занятия, и искать пять строк модели среди
// трёх десятков настроек контура значило каждый раз терять время.
//
