//Имя= Мин,Макс,команда,Мод,Цвет,number
//Цвет : 0- black, 1- red, 2-gold,3- salat, 4- green, 5- blue

// Настройка однофазного моста 48->220: сетевой режим (grid-following) и
// остров. Поля структуры gt, my_Files/grid_tie.h; описание работы -
// my_Files/grid_tie.txt.
//
// Уставки Uref и Iset здесь НЕ задаются - они на движках Gain1 и Load1
// главного окна (кнопка режима над NUD). В таблице то, что задают один раз
// при наладке и потом не трогают.
//
// Значение в таблице - целое, поле в приборе - float, поэтому у каждой
// строки свой масштаб (столбец ниже в комментарии). Прибор пересчитывает
// обратно сам, номера строк совпадают с таблицей gtPars в KSP/MBOX28.c.
//
// Чтение таблицы: щелчок по заголовку "Знач." - прибор отвечает тем, что
// у него на самом деле. Если строка не вернулась - команды нет в прошивке.

[Active]

// Ключ телеметрии: 0 = коды АЦП, 1 = мгновенные, 2 = rms.
// Тот же ключ переключается двойным щелчком по "rms" в панели инвертора.
Ключ_тлм	= 0,2,634,0,2,10

// --- контур тока (PR-регулятор) -------------------------------------------
Kp_x100		= 0,32000,640,0,4,11
Ki		= 0,32000,641,0,4,12
leak_x1e4	= 0,1000,642,0,4,13
xMax_V		= 0,500,643,0,4,14
IsetSlew_x100	= 1,5000,644,0,4,15
Iq_x100		= -2500,2500,645,0,4,16
mMax_x1000	= 0,1000,646,0,4,17

// --- подавление постоянной составляющей (живёт на первичке) ---------------
// kDCp - пропорциональная часть, и именно она даёт затухание: без неё
// интегратор регулятора на интеграторе объекта качается, не сходясь
// (grid_tie.txt, 3.1.6). dcSat - сколько окон ПОДРЯД поправка стоит в упоре,
// прежде чем это попадёт в журнал событием gt_dcSat. Обе строки добавлены
// 25.09.2026: команды в приборе были с 24.09.2026, а строк тут не было, и
// подобрать kDCp живьём было нечем.
kDC_x1e4	= 0,1000,647,0,3,18
kDCp_x1e4	= 0,1000,681,0,3,56
mDCmax_x1000	= 0,200,648,0,3,19
dcSatLimit	= 1,1000,680,0,3,57

// --- контур выходного напряжения острова (АИН) ----------------------------
// Уставка здесь НЕ задаётся - она на движке Gain1 главного окна (команда 633).
//
// Управление двухуровневое: каждый такт амплитуда пересчитывается по
// МГНОВЕННОМУ напряжению звена (прямая связь, снимает и просадку АКБ, и его
// пульсацию 100 Гц), а раз за период ПИ по действующему добирает то, чего
// прямая связь не знает: падения в трансформаторе и ошибку мёртвого времени.
// Здесь коэффициенты этого ПИ. Разбор - my_Files/grid_tie.txt, раздел 11.
//
// Поправка считается в вольтах ДЕЙСТВУЮЩИХ, поэтому коэффициенты безразмерны
// и читаются прямо: Kp = 0.3 это "снять треть ошибки сразу", Ki = 0.1 -
// "добрать десятую часть за период". Звон на 100 Гц в форме выхода - признак
// большого Kp.
//
// uCorMax - предел полномочий контура, а не защита: упор означает, что уставка
// недостижима (просел АКБ, мал n, нагрузка больше расчётной), и через uSatLimit
// периодов подряд в журнал уходит gt_uOutSat. Останова при этом нет.
uOutKp_x1000	= 0,3000,682,0,4,58
uOutKi_x1000	= 0,3000,683,0,4,59
uOutCorMax_x10	= 0,2000,684,0,4,60
uOutSatLimit	= 1,1000,685,0,4,61

// --- масштабы тракта ------------------------------------------------------
n_x100		= 10,3000,649,0,5,20
kU220_x1e4	= 1,10000,650,0,5,21
iSign		= -1,1,651,0,5,22

// --- синхронизация с сетью ------------------------------------------------
syncNeed	= 1,500,652,0,0,23
satLimit	= 0,100,653,0,0,24
noGridMax	= 1,5000,654,0,0,25
phaseOk_x1000	= 1,1000,655,0,0,26

// --- защиты ---------------------------------------------------------------
ImaxPri_x10	= 0,3000,656,0,1,27
ImaxSec_x10	= 0,3000,657,0,1,28
UdcMin_x10	= 0,1000,658,0,1,29
UdcMax_x10	= 0,1000,659,0,1,30
