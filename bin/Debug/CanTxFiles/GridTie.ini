//Имя= Мин,Макс,команда,Мод,Цвет,number
//Цвет : 0- black, 1- red, 2-gold,3- salat, 4- green, 5- blue

// Настройка однофазного моста 48->220: сетевой режим (grid-following) и
// остров. Поля структуры gt, my_Files/grid_tie.h; описание работы -
// my_Files/grid_tie.txt.
//
// Уставки Uref и IsetRef здесь НЕ задаются - они на движках Gain1 и Load1
// главного окна (кнопка режима над NUD). В таблице то, что задают один раз
// при наладке и потом не трогают.
//
// Значение в таблице - целое, поле в приборе - float, поэтому у каждой
// строки свой масштаб (столбец ниже в комментарии). Прибор пересчитывает
// обратно сам, номера строк совпадают с таблицей gtPars в KSP/MBOX28.c.
//
// Чтение таблицы: щелчок по заголовку "Знач." - прибор отвечает тем, что
// у него на самом деле. Если строка не вернулась - команды нет в прошивке.

[Active]

// Ключ телеметрии: 0 = коды АЦП, 1 = мгновенные, 2 = rms.
// Тот же ключ переключается двойным щелчком по "rms" в панели инвертора.
Ключ_тлм	= 0,2,634,0,2,10

// --- контур тока (PR-регулятор) -------------------------------------------
Kp_x100		= 0,32000,640,0,4,11
Ki		= 0,32000,641,0,4,12
leak_x1e4	= 0,1000,642,0,4,13
xMax_V		= 0,500,643,0,4,14
// Токи - ДЕЙСТВУЮЩИЕ значения (с 08.10.2026, раньше амплитуды).
// IsetSlew - шаг рампы за период сети: 10 = 0.1 А rms, то есть 5 А rms/с.
// То же число на главной панели - поле "Рампа" под движком Iзад, в А/с
// (единица этой строки там = 0.5 А/с при 50 Гц).
// Iq - реактивный ток по cos, А rms. 0 = чистая активная.
IsetSlew_x100	= 1,5000,644,0,4,15
Iq_x100		= -2500,2500,645,0,4,16
mMax_x1000	= 0,1000,646,0,4,17

// --- коэффициенты двух медленных контуров ---------------------------------
// Подавление постоянки (647, 681, 648, 680) и контур напряжения острова
// (682..685) переехали 25.09.2026 в отдельную таблицу "Регуляторы АИН".
//
// Причина та же, по которой отдельно живут Модель.ini и ЦАП.ini: в эти строки
// лезут ПОСРЕДИ ОПЫТА, подбирая коэффициент по реакции живой машины, а здесь
// лежит то, что задают один раз при наладке. Искать четыре строки среди трёх
// десятков каждый раз - значит каждый раз терять время.
//
// Контур тока сетевого режима (Kp/Ki/leak/xMax выше) остался ЗДЕСЬ: он
// работает на другой частоте, другим законом и в другом режиме моста.

// --- масштабы тракта ------------------------------------------------------
// n - строка ПАСПОРТА, та же, что в Модель.ini и "Силовая часть.ini": правит
// коэффициент трансформации и контуру, и модели. На модели - на ходу, на
// железе - только при закрытых ключах.
n_x100		= 10,3000,649,0,5,20
// kU220 - В на код канала U220. 2000 = 0.2: полная шкала 289 В действующих.
kU220_x1e4	= 1,10000,650,0,5,21
iSign		= -1,1,651,0,5,22

// --- синхронизация с сетью ------------------------------------------------
syncNeed	= 1,500,652,0,0,23
satLimit	= 0,100,653,0,0,24
noGridMax	= 1,5000,654,0,0,25
phaseOk_x1000	= 1,1000,655,0,0,26

// --- защиты ---------------------------------------------------------------
// ВНИМАНИЕ: ImaxPri и ImaxSec с 25.09.2026 ВЫВОДЯТСЯ из номинальной мощности
// в таблице "Силовая часть" (Imax = 1.41*Pном/Uвых * 1.3, запас 30 %).
// Править их здесь можно, но правка живёт до следующей записи паспорта.
ImaxPri_x10	= 0,3000,656,0,1,27
ImaxSec_x10	= 0,3000,657,0,1,28
UdcMin_x10	= 0,1000,658,0,1,29
UdcMax_x10	= 0,1000,659,0,1,30
freqMin_x10	= 300,700,660,0,1,31
freqMax_x10	= 300,700,661,0,1,32
// Окно напряжения сети для синхронизма, В действующих (до 07.10.2026 было
// в кодах АЦП и сдвигалось при перетарировке kU220).
Uсети_мин_В	= 0,400,662,0,1,33
Uсети_макс_В	= 0,400,663,0,1,34

// --- источники опоры и звена ----------------------------------------------
// UdcSrc: 0 = константа UdcFixed (стенд), 1 = канал uBat.
// refSrc: 0 = опора daca (стенд), 1 = измеренный U220 (реальная сеть).
//
// UdcFixed - это ПРЕДСТАВЛЕНИЕ КОНТУРА о напряжении звена, то, чем он делит
// при расчёте индекса модуляции. На модели настоящее напряжение задаётся
// отдельно, строкой Uвх в таблице Модель.ini, и их расхождение - отдельный
// опыт: просевший АКБ, о котором контур не знает.
UdcSrc		= 0,1,664,0,2,35
UdcFixed_x10	= 0,1000,665,0,2,36
refSrc		= 0,1,666,0,2,37

// Модель силовой части (АКБ, трансформатор, нагрузка) переехала 23.09.2026 в
// отдельную таблицу Модель.ini - вместе с записью формы в кольцевой буфер.
// Причина та же, по которой отдельно живёт ЦАП.ini: параметры железа и
// коэффициенты контура - разные занятия, и искать пять строк модели среди
// трёх десятков настроек контура значило каждый раз терять время.
//
// Выбор величины на отладочный ЦАП (пин A1) - в таблице ЦАП.ini: её открывают
// посреди опыта, а здесь то, что задают один раз при наладке.

[Hidden]

