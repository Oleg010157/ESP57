//Имя= Мин,Макс,команда,Мод,Цвет,number
//Цвет : 0- black, 1- red, 2-gold,3- salat, 4- green, 5- blue

// Отладочный ЦАП на пине A1 (он же B7, D11, HSEC 11) - то, что смотрят
// осциллографом. Своя таблица, а не строки в GridTie.ini: сюда лезут посреди
// опыта, чтобы перекинуть щуп на другую величину, и искать две строки среди
// трёх десятков коэффициентов контура - только терять время.
//
// Реализация - dacDbgSrc и kDacDbg в my_Files/1ph_Sin.c, таблица gtPars в
// KSP/MBOX28.c.
//
// Чтение таблицы: щелчок по заголовку "Знач." - прибор отвечает тем, что
// у него на самом деле. Если строка не вернулась - команды нет в прошивке.

[Active]

// ЧТО выводить. Пин один, поэтому сигнал один за раз.
//
// Имена после седьмого поля - это то, что стоит в ячейке "Знач." вместо
// числа: выбор идёт из выпадающего списка, номер сигнала знать не нужно.
// Порядок имён = порядок значений от 0 и далее, в прибор едет номер.
// Пробелы в именах не ставить, их съедает разбор строки.
Src = 0,11,672,0,3,43, ШИМ_синус, I_первички, I_вторички, индекс_модуляции, I_задание, I_ошибка, U_втор_треб, U_сети_втор, поправка_mDC, U_сети_изм, ошибка_фазы, I_АКБ

// С КАКИМ масштабом: код_на_пине = 2048 + kDacDbg * величина.
// Середина шкалы 2048 - это ноль величины, края 0 и 4095 - обрез.
//
// РУКАМИ ТРОГАТЬ НЕ ОБЯЗАТЕЛЬНО: смена сигнала строкой выше ставит сюда
// масштаб под выбранную величину (таблица kDacDbgDef в my_Files/1ph_Sin.c),
// и строка обновляется сама. Правят её, когда хотят растянуть или поджать
// картинку - до следующей смены сигнала правка держится.
//
// ЧТО ЗДЕСЬ ЗА ЧИСЛО. Не размах и не вольты на деление, а kDacDbg, умноженный
// на десять: таблица умеет только целые, а коэффициент дробный - отсюда и _x10
// в имени. Сам kDacDbg - это КОДОВ НА ЕДИНИЦУ ВЫБРАННОЙ ВЕЛИЧИНЫ, и единица
// меняется вместе с источником:
//
//   токи (I_первички, I_вторички, I_задание, I_ошибка, I_АКБ) - на ампер
//   напряжения (U_втор_треб, U_сети_втор, U_сети_изм)         - на вольт
//   безразмерные (индекс_модуляции, поправка_mDC, ошибка_фазы) - на единицу
//
// РАЗМАХ ОТСЮДА СЛЕДУЕТ, а не задаётся: полшкалы ЦАП - 2048 кодов, значит
// упор наступает на 2048/kDacDbg. При 512 в таблице (kDacDbg = 51.2) это
// 2048/51.2 = 40, то есть +-40 А. Обратный счёт:
//
//     значение_в_таблице = 20480 / желаемый_размах
//
//   токи:        +-40 А -> 512     +-20 А -> 1024    +-10 А -> 2048
//                +-100 А -> 205    +-1 А  -> 20480
//   напряжения:  +-400 В -> 51     +-200 В -> 102    +-100 В -> 205
//   безразмерные: +-1    -> 20480
//
// Чем меньше размах, тем крупнее сигнал на экране и тем раньше он срежется
// о край шкалы.
//
// ТОЧНОСТЬ. Шаг таблицы - 0.1 кода на единицу. Для токов это ничто, а для
// напряжений сам коэффициент около пяти, и те же 0.1 дают уже 2%. Прошивка
// при смене источника ставит себе точные 5.12, но в таблице вы увидите
// округлённое 51, и первое же нажатие "+" или "-" запишет в прибор 5.2.
// Для осциллографа несущественно - смотрят форму, а не меряют амплитуду.
//
// Потолок значения 32000, то есть kDacDbg не больше 3200.
kDac_x10	= -32000,32000,673,0,3,44

